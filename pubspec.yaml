name: shiftease
description: Shift scheduling app for shift workers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.4
  flutter_secure_storage: ^9.2.4
  google_mobile_ads: ^9.1.0
  path_provider: ^2.1.4
  sentry_flutter: ^9.28.0
  sqlite3: ^3.5.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  test: ^1.24.0
  lints: ^3.0.0

flutter:
  uses-material-design: true

# P7.2 (production verification, P7_fix1.md): link SQLCipher instead of the
# plain SQLite build. With package:sqlite3 3.x the native library arrives via
# Dart/Flutter build hooks; `source: sqlcipher` swaps the plain sqlite3.c for
# SQLCipher 4.x — so `PRAGMA key` actually encrypts and `PRAGMA cipher_version`
# returns a real version. No plain fallback: if the hook cannot provide the
# SQLCipher asset the build FAILS, encryption is not silently dropped.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

# Launcher icon generation (2026-09-11): run `dart run flutter_launcher_icons`
# after changing the source PNG (assets/icon/shiftease_icon.png).
flutter_launcher_icons:
  image_path: "assets/icon/shiftease_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: "assets/icon/shiftease_icon_foreground.png"

# AdMob defaults (2026-09-12). NOTHING reads this block at runtime — it
# records the defaults of lib/config/ads_config.dart, which every build can
# override without editing code:
#   --dart-define=TEST_ADS=false     → use the production AdMob unit IDs
#                                      (ONLY once they are filled in below);
#                                      default true = Google TEST units, no
#                                      real ad traffic, no AdMob LIMIT risk.
#   --dart-define=ENABLE_ADS=false   → ad stack fully off; pair it with the
#                                      native half `--android-project-arg=
#                                      enableAds=false` so no AdMob
#                                      APPLICATION_ID ships in the manifest.
admob:
  test_ads: true
  enable_ads: true

