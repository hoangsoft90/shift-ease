# ShiftEase — Release APK build (ads-disabled, release keystore)
#
# Builds a RELEASE APK signed with the project release keystore, with AdMob
# APPLICATION_ID stripped from the manifest (-PenableAds=false). Intended for
# QA/install on a real device when you want a production-flavoured build WITHOUT
# ads (e.g. before the AdMob account is finalized, or for reviewer builds).
#
# Two artifacts are uploaded:
#   • shiftease-release-apk-signed.apk — signed (if keystore present; otherwise
#     falls back to debug-signed so the run still produces an installable file)
#   • shiftease-release-apk-unsigned.apk — from assembleRelease before signing,
#     useful if you just want the raw Gradle output
#
# Secrets (set on the repo; agent does NOT create them):
#   ANDROID_KEYSTORE_BASE64  — base64 of the .jks/.keystore file (REQUIRED to
#                              produce a release-signed APK; without it the job
#                              still runs but the APK is debug-signed)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Play Console: release-signed APK is installable but preferred store artifact
# is the AAB (use `flutter build appbundle --release` + Play App Signing).
# This workflow produces an APK for device QA only.

name: Build release APK (ads disabled)

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'ios/**'
      - 'tool/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      enable_ads:
        description: 'Pass -PenableAds=false to strip AdMob app ID (recommended for no-ad release QA)'
        required: false
        default: 'false'
      dry_run:
        description: 'If true, skip signing and upload only the unsigned APK'
        required: false
        default: 'false'

jobs:
  build-release-apk:
    name: Build release APK (ads disabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Show pubspec admob block
        run: |
          echo "=== pubspec admob block ==="
          awk '/^admob:/{f=1} f&&/^[^ ]/{if(!/^admob:/)exit} f' pubspec.yaml
          echo "=========================="

      - name: Decode release keystore (if secret present)
        id: keystore
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > release.keystore
            echo "present=true" >> $GITHUB_OUTPUT
            echo "Keystore decoded ($(stat -c%s release.keystore) bytes)"
          else
            echo "present=false" >> $GITHUB_OUTPUT
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APK will be debug-signed, not release-signed"
          fi

      - name: Gradle properties (ads disabled for release QA)
        id: props
        run: |
          ENABLED="${{ github.event.inputs.enable_ads || 'false' }}"
          echo "enableAds=$ENABLED" >> $GITHUB_OUTPUT
          echo "Passed enableAds=$ENABLED (false => manifest AdMob APPLICATION_ID stripped)"

      - name: Gradle wrapper up-to-date check
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::Missing gradlew — cannot build (repo must ship the wrapper)"
            exit 1
          fi
          chmod +x gradlew

      - name: Build release APK (unsigned)
        env:
          ENABLED: ${{ steps.props.outputs.enableAds }}
        run: |
          ./gradlew -p android assembleRelease \
            -PenableAds="$ENABLED" \
            --no-daemon \
            -q
          echo "=== APK outputs ==="
          find android/app/build/outputs/apk/release -name '*.apk' -exec ls -lh {} \;

      - name: Copy unsigned APK for upload
        id: unsigned
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          cp "$APK" shiftease-release-apk-unsigned.apk
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "unsigned=$APK" >> $GITHUB_OUTPUT

      - name: Sign release APK with release keystore
        id: sign
        if: steps.keystore.outputs.present == 'true' && github.event.inputs.dry_run != 'true'
        env:
          KS_FILE: release.keystore
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          UNSIGNED="${{ steps.unsigned.outputs.unsigned }}"
          SIGNED="shiftease-release-apk-signed.apk"
          # Use jarsigner for maximum compatibility with either .jks or .keystore.
          jarsigner -verbose \
            -storepass "$KS_PASS" -alias "$KS_ALIAS" -keypass "$KS_KEY_PASS" \
            -keystore "$KS_FILE" \
            "$UNSIGNED" "$KS_ALIAS" \
            && mv "$UNSIGNED" "$SIGNED"
          echo "signed_path=$SIGNED" >> $GITHUB_OUTPUT
          echo "APK signed with release keystore"

      - name: Verify APK signature (fail CI if still debug-signed when keystore present)
        if: steps.keystore.outputs.present == 'true'
        env:
          SIGNED: ${{ steps.sign.outputs.signed_path }}
        run: |
          set -e
          if [ -z "$SIGNED" ]; then
            echo "::error::No signed APK path — signing step did not produce an artifact"
            exit 1
          fi
          # Find apksigner on the runner.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found — cannot verify; upload still proceeds"
            exit 0
          fi
          "$APKSIGNER" verify --print-certs "$SIGNED" \
            | tee /tmp/apksigner-certs.txt
          if grep -q "CN=Android Debug" /tmp/apksigner-certs.txt; then
            echo "::error::APK is signed with the DEBUG keystore — release signing did not apply"
            exit 1
          fi
          echo "::notice::APK is release-signed (non-debug CN)"

      - name: Verify no AdMob app ID in manifest (ads-disabled supply-chain)
        if: steps.props.outputs.enableAds == 'false'
        run: |
          set -e
          # Find the APK we will upload (signed if present, else unsigned).
          APK="${{ steps.sign.outputs.signed_path }}"
          if [ -z "$APK" ]; then
            APK="${{ steps.unsigned.outputs.unsigned }}"
          fi
          # Unzip only the manifest (small, fast).
          TMPDIR=$(mktemp -d)
          unzip -q -o "$APK" AndroidManifest.xml -d "$TMPDIR"
          grep -n "com.google.android.gms.ads.APPLICATION_ID" "$TMPDIR/AndroidManifest.xml" \
            || { echo "::error::APK manifest missing AdMob APPLICATION_ID meta-data — unexpected"; exit 1; }
          VALUE=$(grep -o 'android:value="[^"]*"' "$TMPDIR/AndroidManifest.xml" \
            | grep -o '"[^"]*"$' | tr -d '"' | head -1)
          if [ -n "$VALUE" ]; then
            echo "::error::Ads-disabled build still shipped an AdMob APPLICATION_ID ($VALUE) — enableAds was not honoured"
            exit 1
          fi
          echo "APK manifest AdMob APPLICATION_ID (should be empty): '$VALUE' — OK"
          rm -rf "$TMPDIR"

      - uses: actions/upload-artifact@v4
        with:
          name: shiftease-release-apk-signed
          path: shiftease-release-apk-signed.apk
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: shiftease-release-apk-unsigned
          path: shiftease-release-apk-unsigned.apk
          if-no-files-found: error
          retention-days: 30
