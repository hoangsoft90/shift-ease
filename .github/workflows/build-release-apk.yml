# ShiftEase — Release APK build (release keystore, ads switchable)
#
# Produces a RELEASE-mode APK for device QA. Two independent switches, both
# passed by this workflow (no Dart/Gradle edits needed):
#
#   • enable_ads (default false) → the whole ad stack is off:
#       --android-project-arg=enableAds=false  blanks the AdMob APPLICATION_ID
#                                              in the merged manifest
#       --dart-define=ENABLE_ADS=false         Dart never initializes the SDK
#     Set it to true for a production-flavoured build — then test_ads decides
#     whether Google test units or the real AdMob units serve.
#
#   • test_ads (default true) → Google TEST ad units / sample app IDs
#     (no real ad traffic, no invalid-traffic LIMIT risk on the AdMob account).
#     Set false ONLY once production unit IDs are in lib/config/ads_config.dart.
#
# Signing: android/key.properties + android/release.keystore are written from
# GitHub secrets. If ANDROID_KEYSTORE_BASE64 is absent the job still runs and
# produces a DEBUG-signed release APK (installable for QA, NOT uploadable to
# Play) and says so in the summary.
#
# Secrets (set by the repo owner in Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of the .jks/.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Play Console: prefer an AAB (`flutter build appbundle --release`) + Play App
# Signing for the actual store upload. This workflow's APK is for QA only.
#
# NOTE: build via `flutter build apk`, never `./gradlew`. The repo deliberately
# does not commit the Gradle wrapper (android/.gitignore) — flutter_tools
# injects the pinned wrapper (gradle 9.3.1) from its own cache, so a raw
# ./gradlew invocation fails with "Missing gradlew".

name: Build release APK (ads disabled)

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/build-release-apk.yml'
  workflow_dispatch:
    inputs:
      enable_ads:
        description: 'Ship ads in this build? (false = ads fully disabled)'
        type: choice
        options: ['false', 'true']
        default: 'false'
      test_ads:
        description: 'Use Google test ad units? (set false only with real AdMob unit IDs)'
        type: choice
        options: ['true', 'false']
        default: 'true'

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      # Push events have no inputs → default to an ads-disabled release QA build.
      ENABLE_ADS: ${{ github.event.inputs.enable_ads || 'false' }}
      TEST_ADS: ${{ github.event.inputs.test_ads || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (fail fast before Gradle)
        run: flutter analyze --fatal-warnings

      - name: Run the full test suite (no artifact from a red suite)
        run: flutter test test/ --reporter compact

      - name: Decode release keystore (if secret present)
        id: keystore
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$KS_BASE64" ]; then
            # android/.gitignore covers key.properties, *.keystore, *.jks —
            # nothing here can be committed by accident.
            printf '%s' "$KS_BASE64" | base64 -d > android/release.keystore
            # Quoted heredoc: secrets containing $ or backticks are written
            # verbatim instead of being expanded by the shell.
            cat > android/key.properties <<'PROPS'
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          PROPS
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded ($(stat -c%s android/release.keystore) bytes)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — the release APK will be DEBUG-signed (installable for QA, not uploadable to Play)"
          fi

      - name: Build release APK
        run: |
          set -e
          ARGS=(--release)
          if [ "$ENABLE_ADS" = "false" ]; then
            ARGS+=(--android-project-arg=enableAds=false)
          fi
          ARGS+=(--dart-define=ENABLE_ADS="$ENABLE_ADS" --dart-define=TEST_ADS="$TEST_ADS")
          echo "flutter build apk ${ARGS[*]}"
          flutter build apk "${ARGS[@]}"
          ls -lh build/app/outputs/flutter-apk/

      - name: Verify ads are actually stripped from the APK
        if: env.ENABLE_ADS == 'false'
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          # The publisher ID appears verbatim in the manifest string pool when
          # the placeholder was not blanked. `strings` reads the binary AXML.
          if unzip -p "$APK" AndroidManifest.xml | strings | grep -q 'ca-app-pub-6917313063209470'; then
            echo "::error::Ads-disabled build still ships the AdMob APPLICATION_ID — enableAds was not honoured"
            exit 1
          fi
          echo "OK: no AdMob APPLICATION_ID in the merged manifest"

      - name: Verify APK signature
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found — skipping signature verification"
            exit 0
          fi
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apksigner-certs.txt
          if grep -q "CN=Android Debug" /tmp/apksigner-certs.txt; then
            if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
              echo "::error::APK is still DEBUG-signed although a release keystore was provided — check key.properties"
              exit 1
            fi
            echo "::warning::APK is debug-signed (no release keystore configured) — fine for QA, not for Play"
          else
            echo "::notice::APK is release-signed"
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shiftease-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
