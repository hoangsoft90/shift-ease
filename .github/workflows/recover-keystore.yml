name: Recover keystore (one-off — delete after use)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Fail fast if any secret is missing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REC_PASS: ${{ secrets.ANDROID_RECOVERY_PASS }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_PASS" ] && missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "$ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$REC_PASS" ] && missing="$missing ANDROID_RECOVERY_PASS"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing"
            exit 1
          fi

      - name: Decode keystore, verify it, pack encrypted archive
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REC_PASS: ${{ secrets.ANDROID_RECOVERY_PASS }}
        run: |
          printf '%s' "$KS" | base64 -d > release.keystore
          echo "size: $(stat -c%s release.keystore) bytes"
          # Integrity proof: the keystore must open with the configured
          # store password AND contain the configured alias.
          keytool -list -keystore release.keystore -storetype PKCS12 \
            -storepass "$KS_PASS" -alias "$ALIAS" > alias.txt || {
              echo "::error::Keystore does NOT open with ANDROID_KEYSTORE_PASSWORD / alias mismatch"
              exit 1
            }
          cat alias.txt
          # Encrypted payload: passphrase never appears in the artifact,
          # only in the repo secret ANDROID_RECOVERY_PASS.
          tar czf bundle.tgz release.keystore alias.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 \
            -salt -in bundle.tgz -out bundle.tgz.enc -pass env:REC_PASS
          rm -f release.keystore bundle.tgz

      - name: Upload encrypted recovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: keystore-recovery-encrypted
          path: bundle.tgz.enc
          retention-days: 1
          if-no-files-found: error

      - name: Upload integrity proof (public info only)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-recovery-proof
          path: alias.txt
          retention-days: 1
          if-no-files-found: error
